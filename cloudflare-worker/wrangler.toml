name = "shibui-lorekeeper-proxy"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Bind the worker only to /lorekeeper* on the production zone. Anything
# outside that path is untouched and continues to hit the Webflow origin.
[[routes]]
pattern = "shibuiuniverse.com/lorekeeper*"
zone_name = "shibuiuniverse.com"

# Upstream Pages deployment. Update after the first Pages deploy with the
# real *.pages.dev URL (or after attaching a custom hostname).
[vars]
LOREKEEPER_HOST = "https://shibui-lorekeeper.pages.dev"
